<title>Booking Home Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#F0661F; --brand-600:#D9561A; --brand-50:#FEF1EA; --brand-100:#FCDCCB; --brand-ring:rgba(240,102,31,.22);
    --ground:#F4F4F5; --card:#FFFFFF; --line:#E4E4E7; --line-soft:#F1F1F3;
    --text:#27272A; --muted:#71717A; --subtle:#A1A1AA;
    --success:#047857; --success-bg:#ECFDF5; --success-line:#A7F3D0;
    --warning:#B45309; --warning-bg:#FFFBEB; --warning-line:#FDE68A;
    --danger:#DC2626; --danger-bg:#FEF2F2; --danger-line:#FECACA;
    --info:#1D4ED8; --info-bg:#EFF6FF; --info-line:#BFDBFE;
    --h:42px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3{margin:0;text-wrap:balance}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
  .sidebar.collapsed{display:none}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;position:sticky;top:0;z-index:20}
  .content{padding:28px 28px 120px;display:flex;flex-direction:column;gap:18px;max-width:1620px;width:100%;margin:0 auto}
  .logo{display:flex;align-items:center;gap:8px;padding:22px 20px 14px}
  .logo .mark{font-weight:800;font-size:26px;letter-spacing:-.04em;color:var(--brand);line-height:1}
  .logo .sub{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav{padding:8px 12px;display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
  .nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle);font-weight:600;padding:8px 8px 2px}
  .nav-group{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line-soft);box-shadow:0 1px 3px rgba(24,24,27,.07);font-size:13.5px;font-weight:600;color:var(--text)}
  .nav-sub{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 12px 9px 14px;margin:2px 0 0 10px;width:calc(100% - 10px);border-radius:8px;font-size:13px;color:var(--muted);background:transparent;border:0}
  .nav-sub:hover{background:var(--ground);color:var(--text)}
  .nav-sub.active{background:var(--brand);color:#fff;font-weight:600}
  .nav-sub .soon{margin-left:auto;font-size:10px;color:var(--subtle);border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .side-foot{padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--subtle)}

  .crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .crumb b{color:var(--text);font-weight:700}
  .crumb .sep{color:var(--subtle)}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .icon-btn:hover{background:var(--ground);color:var(--text)}

  /* ---------- lang + user ---------- */
  .langsw{display:flex;background:var(--ground);border-radius:999px;padding:4px;gap:4px}
  .langsw button{border:0;background:transparent;border-radius:999px;height:30px;padding:0 16px;font-size:13px;font-weight:600;color:var(--muted)}
  .langsw button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(24,24,27,.12)}
  .user-btn{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
  .user-btn .av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .user-btn .nm{font-weight:700;font-size:13.5px;line-height:1.15;text-align:left}
  .user-btn .ds{font-size:11.5px;color:var(--muted);text-align:left}

  /* ---------- stepper ---------- */
  .stepper{display:flex;align-items:flex-start;justify-content:center;gap:0;padding:24px 0 8px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:10px;width:200px}
  .stp .dot{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--subtle)}
  .stp .dot i{width:6px;height:6px;border-radius:50%;background:var(--subtle);display:block}
  .stp.on .dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--brand-100)}
  .stp.on .dot i{background:#fff;width:12px;height:12px;border:2px solid #fff;background:transparent}
  .stp.done .dot{background:var(--brand-50);border-color:var(--brand);color:var(--brand)}
  .stp .lb{font-size:14px;font-weight:700;color:var(--subtle);text-align:center}
  .stp .sb{font-size:13px;color:var(--subtle);margin-top:-6px;text-align:center}
  .stp.on .lb{color:var(--brand)}
  .stp.on .sb{color:var(--brand)}
  .stp.done .lb{color:var(--text)}
  .stp-bar{flex:1;height:1px;background:var(--line);margin-top:17px;min-width:60px;max-width:200px}
  .stp-bar.on{background:var(--brand-100)}

  /* ---------- card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
  .card-h{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .card-h .ci{color:var(--text)}
  .card-t{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}

  /* ---------- fields ---------- */
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
  .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .field label{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px}
  .field label .req{color:var(--danger);font-weight:700}
  .field .hint{font-size:12.5px;color:var(--muted)}
  .field.err label{color:var(--danger)}
  .field.err .hint{color:var(--danger)}
  .field.err .input,.field.err .select,.field.err .combo{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.10)}
  .pfeed{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin-top:7px;line-height:1.45}
  .pfeed b{font-weight:700}
  .pfeed.ok{color:var(--success)}
  .pfeed.err{color:var(--danger)}
  .pfeed.warn{color:var(--warning)}
  .pfeed.info{color:var(--muted)}
  .chkline{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
  .chkline input{width:16px;height:16px;accent-color:var(--brand)}
  .pfeed svg{margin-top:1px}
  .input,.select{width:100%;height:var(--h);border:1px solid var(--line);border-radius:11px;padding:0 14px;font-size:14px;background:#fff;color:var(--text)}
  .input::placeholder{color:var(--subtle)}
  .select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:38px;cursor:pointer}
  .input:focus,.select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
  .input:disabled,.select:disabled{background:#FAFAFA;color:var(--muted);cursor:not-allowed}
  .input.ro{background:#FAFAFA;color:var(--muted)}
  .select.picked{color:var(--info)}

  /* phone group */
  .phone{display:flex;gap:12px}
  .cc{position:relative;flex:none;width:112px}
  .cc .select{padding-left:38px}
  .cc .flag{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;line-height:1;pointer-events:none}
  .phone .input{flex:1}

  /* combo (searchable select) */
  .combo{position:relative;width:100%;height:var(--h);border:1px solid var(--line);border-radius:11px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;text-align:left;font-size:14px;color:var(--text)}
  .combo.ro{background:#FAFAFA;color:var(--muted);cursor:not-allowed}
  .combo .ph{color:var(--subtle)}
  .combo .cv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .combo .ci{color:var(--subtle);flex:none}
  .combo:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  /* kotak pencarian unit (input langsung, suggestion muncul di bawah) */
  .searchbox{position:relative;width:100%;height:var(--h);border:1px solid var(--line);border-radius:11px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
  .searchbox .ci{color:var(--subtle);flex:none;display:flex;align-items:center}
  .searchbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:14px;height:100%;color:var(--text)}
  .searchbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
  .pop{position:absolute;z-index:60;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(24,24,27,.14);padding:6px;max-height:260px;overflow:auto}
  .pop .s{position:sticky;top:-6px;z-index:2;background:#fff;margin:-6px -6px 6px;padding:6px;border-bottom:1px solid var(--line-soft)}
  .pop .s input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px 0 30px;font-size:13px}
  .pop .s input:focus{outline:none;border-color:var(--brand)}
  .pop .s svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--subtle)}
  .opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:13.5px;color:var(--text)}
  .opt:hover,.opt.hl{background:var(--brand);color:#fff}
  .opt.sel .chk{margin-left:auto;color:var(--brand)}
  .opt.sel:hover .chk,.opt.hl .chk{color:#fff}
  .opt .sub{font-size:12px;color:var(--muted);margin-left:auto}
  .opt:hover .sub,.opt.hl .sub{color:rgba(255,255,255,.85)}
  .pop .empty{padding:14px 10px;font-size:13px;color:var(--muted);text-align:center}

  /* ---------- pill tabs ---------- */
  .pilltabs{display:inline-flex;background:var(--ground);border-radius:999px;padding:4px;gap:2px}
  .pilltab{border:0;background:transparent;border-radius:999px;height:34px;padding:0 16px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .pilltab.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(24,24,27,.12)}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:11px;font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-600)}
  .btn-outline{background:#fff;border-color:var(--line);color:var(--text)}
  .btn-outline:hover{background:var(--ground)}
  .btn-brand-outline{background:#fff;border-color:var(--brand);color:var(--brand);border-radius:999px}
  .btn-brand-outline:hover{background:var(--brand-50)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-ghost:hover{background:var(--ground);color:var(--text)}
  .btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- search row ---------- */
  .searchrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .searchrow .by{width:190px}
  .searchrow .q{width:260px;position:relative}

  /* ---------- summary + slots ---------- */
  .summary{border:2px dashed var(--brand);background:#FFF9F4;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .summary .t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .summary .r{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
  .summary .r b{color:var(--text);font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
  .slots{display:flex;flex-wrap:wrap;gap:8px}
  .slot{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .slot:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .slot.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .slot:disabled{background:var(--ground);color:var(--subtle);text-decoration:line-through;cursor:not-allowed}
  /* summary bisa diklik utk buka modal slot jam */
  .summary.err{border-color:var(--danger);background:#FEF2F2}
  .summary.clickable{cursor:pointer;transition:box-shadow .15s,background .15s}
  .summary.clickable:hover{background:#FFF3E9;box-shadow:0 4px 14px rgba(249,115,22,.14)}
  .summary .hintline{font-size:11.5px;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px}
  /* modal slot jam booking */
  .tsdate{border-left:3px solid var(--brand);padding-left:12px;margin:8px 0 18px}
  .tsdate .d{font-size:12px;color:var(--muted);font-weight:600}
  .tsdate .f{font-size:19px;font-weight:800;color:var(--text)}
  .tslots{display:flex;flex-wrap:wrap;gap:12px}
  .tslot{min-width:150px;flex:1 1 150px;max-width:200px;border:1.5px solid var(--brand);border-radius:12px;padding:12px 14px;background:#fff;text-align:center;cursor:pointer}
  .tslot .tt{font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
  .tslot .ts{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}
  .tslot:hover:not(:disabled){background:#FFF3E9}
  .tslot.on{background:var(--brand);border-color:var(--brand)}
  .tslot.on .tt,.tslot.on .ts{color:#fff}
  .tslot.full{border-color:var(--line);opacity:.55;cursor:not-allowed}
  .tslot.full .tt{text-decoration:line-through;color:var(--subtle)}
  /* Langkah 2: chips mekanik + list service/part */
  .addrow{display:flex;gap:10px;align-items:flex-start}
  .addrow .grow{flex:1;min-width:0}
  .btnadd{height:var(--h);flex:none;white-space:nowrap;padding:0 16px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#FFF3E9;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
  .chip button{border:0;background:transparent;color:var(--brand);display:inline-flex;cursor:pointer;padding:2px;border-radius:50%}
  .chip button:hover{background:rgba(249,115,22,.18)}
  .itemlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .item .in{flex:1;font-size:13.5px;font-weight:600;color:var(--text)}
  .item .ip{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
  .item .irm{border:0;background:transparent;color:var(--subtle);cursor:pointer;display:inline-flex;padding:4px;border-radius:8px}
  .item .irm:hover{background:var(--ground);color:var(--danger)}
  .item .qty{display:inline-flex;align-items:center;gap:8px}
  .item .qty button{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
  .item .qty button:hover{border-color:var(--brand);color:var(--brand)}
  .item .qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  /* Service/Part list (kartu item) */
  .svclist{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .svcitem{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .svcitem .svcbody{flex:1;min-width:0}
  .svcitem .svctitle{font-size:14px;font-weight:800;color:var(--brand);margin-bottom:8px}
  .svcitem .svcmeta{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
  .svcitem .svcmeta span{display:inline-flex;align-items:center;gap:6px}
  .svcdel{border:0;background:transparent;color:var(--danger);cursor:pointer;padding:6px;border-radius:8px;flex:none}
  .svcdel:hover{background:#FEF2F2}
  /* empty state */
  .emptybox{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 16px;gap:8px}
  .emptybox .ill{width:76px;height:76px;border-radius:50%;background:#FFF3E9;color:var(--brand);display:flex;align-items:center;justify-content:center}
  .emptybox .et{font-size:16px;font-weight:800;color:var(--text);margin-top:4px}
  .emptybox .ed{font-size:13px;color:var(--muted);max-width:360px}
  /* modal Tambah Service/Part */
  .modal-lg{max-width:640px}
  .mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .mhead h3{font-size:18px;font-weight:800;margin:0}
  .mhead .msub{font-size:13px;color:var(--muted);margin:2px 0 0}
  .mhead .icon-btn{margin-left:auto}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  .pkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
  .pkg-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .pkg-btn:hover{background:#FFF3E9}
  .pkg-btn.on{background:var(--brand);color:#fff}
  .pkg-cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
  .pkg-cat:hover{border-color:var(--brand);color:var(--brand)}
  .pkg-cat.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pksearch{position:relative;display:flex;align-items:center;margin-left:auto;min-width:200px}
  .pksearch svg{position:absolute;right:12px;color:var(--subtle)}
  .pksearch input{width:100%;height:38px;border:1px solid var(--line);border-radius:999px;padding:0 38px 0 14px;font-size:13px}
  .pksearch input:focus{outline:none;border-color:var(--brand)}
  .svcgrouptitle{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px}
  .segbadge{display:inline-block;margin-left:6px;background:#FFF3E9;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;vertical-align:middle}
  .pkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .pkcard{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer}
  .pkcard:hover{border-color:var(--brand)}
  .pkcard.on{border-color:var(--brand);background:#FFF3E9}
  .pkcard .pkname{font-size:14px;font-weight:800;color:var(--brand);margin-bottom:6px}
  .pkcard .pksub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .pkcard .pksub svg{flex:none}
  .pksub .dot{width:4px;height:4px;border-radius:50%;background:var(--line);flex:none}

  /* ---------- misc ---------- */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-50);color:var(--brand)}
  .badge.ok{background:var(--success-bg);color:var(--success)}
  .badge.info{background:var(--info-bg);color:var(--info)}
  .note{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid var(--info-line);color:#1E3A8A;border-radius:12px;padding:12px 14px;font-size:13px}
  .note.warn{background:var(--warning-bg);border-color:var(--warning-line);color:#7C2D12}
  .footbar{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);margin:8px -28px -120px;padding:14px 28px;display:flex;align-items:center;gap:12px;z-index:15}
  .footbar .sp{margin-left:auto;display:flex;gap:10px}
  .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px}
  .kv .k{font-size:12px;color:var(--muted)}
  .kv .v{font-size:13.5px;font-weight:600;margin-top:2px}

  /* ---------- toasts ---------- */
  .toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(24,24,27,.14);font-size:13.5px;min-width:280px;animation:tin .18s ease-out}
  .toast.ok{border-left-color:var(--success)}
  .toast.err{border-left-color:var(--danger)}
  .toast .x{margin-left:auto;background:none;border:0;color:var(--subtle);padding:0}
  @keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---------- modal ---------- */
  .ovl{position:fixed;inset:0;background:rgba(24,24,27,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:70}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:760px;max-height:86vh;overflow:auto;padding:22px 24px}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
  pre.code{background:#18181B;color:#E4E4E7;border-radius:12px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;overflow:auto;margin:12px 0 0}

  /* ---------- doc ---------- */
  .doc{max-width:1000px}
  .doc h2{font-size:16px;font-weight:700;margin:24px 0 8px}
  .doc h2:first-child{margin-top:0}
  .doc p,.doc li{font-size:13.5px;color:#3F3F46}
  .doc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--ground);padding:1px 6px;border-radius:6px;color:#3F3F46}
  .doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  .doc th,.doc td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .doc th{background:#FAFAFA;font-weight:600;color:var(--muted)}


  @media (max-width:1200px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:900px){
    .sidebar{display:none}

    .stp{width:auto;min-width:96px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- prefix nomor handphone (master PREFIXPHONE) -------------------
   Semua prefix dinormalkan ke 3 digit tanpa 0 / tanpa 62 supaya
   '0812', '62812' dan '812' dianggap sama. */
const normPrefix = v => String(v || '').replace(/\D/g, '').replace(/^62/, '').replace(/^0+/, '').slice(0, 3);
const PREFIX_INDEX = (() => {
  const map = {};
  GV_PREFIXPHONE.forEach(r => {
    [r.code, r.display].forEach(v => { const p = normPrefix(v); if (p.length === 3 && !map[p]) map[p] = r; });
  });
  return map;
})();
/* null = belum cukup digit untuk dicek, undefined = tidak terdaftar */
function lookupProvider(phone){
  const digits = String(phone || '').replace(/\D/g, '');
  if (digits.length < 3) return null;
  return PREFIX_INDEX[digits.slice(0, 3)];
}
const isIndonesia = () => S.form.callerphonecc === '+62';
const fmtDate = iso => { if (!iso) return '-'; const p = iso.split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; };
// tanggal panjang berbahasa Indonesia utk header modal slot jam
const ID_DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const ID_MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fmtDateLong(iso){
  if (!iso) return { day:'', full:'' };
  const p = iso.split('-').map(Number);
  if (p.length !== 3) return { day:'', full:iso };
  const dt = new Date(p[0], p[1]-1, p[2]);
  return { day: ID_DAYS[dt.getDay()], full: p[2] + ' ' + ID_MONTHS[p[1]-1] + ' ' + p[0] };
}

function toast(msg, kind){
  const box = document.getElementById('toasts');

    '<span>' + esc(msg) + '</span><button class="x" aria-label="Tutup">' + ic('x', 14) + '</button>';
  el.querySelector('.x').onclick = () => el.remove();

}

function setF(name, value, rerender){
  S.form[name] = value;
  if (S.errors[name]) { delete S.errors[name]; rerender = true; }
  if (name === 'lastkilometer'){
    // km baru tidak boleh kurang dari lastkilometer kendaraan (mstvehicle)
    const min = Number(S.form.minkilometer || 0);
    const val = Number(String(value).replace(/\D/g, '') || '0');
    if (String(value).trim() !== '' && min > 0 && val < min) S.errors.lastkilometer = 'booking.form.kmBelowLast';
    else delete S.errors.lastkilometer;
    rerender = true;
  }
  if (name === 'geoprovinceid'){ S.form.geocityid = ''; S.form.geodistrictid = ''; S.form.geovillageid = ''; rerender = true; }
  if (name === 'geocityid'){ S.form.geodistrictid = ''; S.form.geovillageid = ''; rerender = true; }
  if (name === 'geodistrictid'){ S.form.geovillageid = ''; rerender = true; }

  if (name === 'stnkgeocityid'){ S.form.stnkgeodistrictid = ''; S.form.stnkgeovillageid = ''; rerender = true; }
  if (name === 'stnkgeodistrictid'){ S.form.stnkgeovillageid = ''; rerender = true; }
  if (name === 'bookingtypecode'){
    if ((value === 'HS' || value === 'AJ') && !S.form.geoprovinceid) S.form.geoprovinceid = '3500';
    rerender = true;
  }
  if (name === 'callerphonecc'){
    // ganti negara -> hitung ulang provider & buang sisa 0 di depan untuk +62
    if (isIndonesia()) onPhoneInput(S.form.callerphone);
    else { S.form.callerphoneprovider = ''; S.phoneZeroHint = false; }
    rerender = true;
  }
  if (name === 'bookingdate'){ S.form.bookingtime = ''; rerender = true; }
  if (rerender) render();
}
/* Nomor telepon: hanya digit; untuk +62 angka 0 di depan ditolak.
   Provider dicari dari 3 digit pertama (master PREFIXPHONE). */
function onPhoneInput(raw){
  let digits = String(raw).replace(/\D/g, '');
  if (isIndonesia()){
    const stripped = digits.replace(/^0+/, '');
    S.phoneZeroHint = stripped !== digits;
    digits = stripped.slice(0, 13);   // +62 maksimal 13 digit (cap keras, termasuk paste)
  } else {
    S.phoneZeroHint = false;
  }
  S.form.callerphone = digits;
  const hit = isIndonesia() ? lookupProvider(digits) : null;
  S.form.callerphoneprovider = hit ? hit.name : '';
  delete S.errors.callerphone;
  // hit === undefined -> 3 digit awal sudah lengkap tapi tidak ada di master
  if (isIndonesia() && hit === undefined) S.errors.callerphone = 'booking.form.phoneNotRegistered';
  render();
}

// fetch ke API pencarian; kembalikan array hasil (live atau fallback dummy)
async function fetchUnits(q){
  const reqId = ++S.searchReq;
  S.searchLoading = true; render();
  let list = [];
  try {
    const res = await fetch(SEARCH_API + '/unit/search?by=' + encodeURIComponent(S.searchBy) + '&q=' + encodeURIComponent(q));
    const j = await res.json();
    if (reqId !== S.searchReq) return S.searchResults;   // hasil usang, abaikan
    if (j.ok){ list = j.data; S.searchOffline = false; }
    else { list = []; S.searchOffline = false; toast('API error: ' + esc(j.error || ''), 'err'); }
  } catch (e){
    if (reqId !== S.searchReq) return S.searchResults;
    S.searchOffline = true;                              // server tidak aktif -> pakai data contoh
    list = dummySearch(q);
  }
  S.searchResults = list; S.searchLoading = false; render();
  return list;
}

  f.stnkgeoprovinceid = stnk.geoprovinceid || ''; f.stnkprovincename = stnk.provincename || '';
  f.stnkgeocityid = stnk.geocityid || '';         f.stnkcityname = stnk.cityname || '';
  f.stnkgeodistrictid = stnk.geodistrictid || ''; f.stnkdistrictname = stnk.districtname || '';
  f.stnkgeovillageid = stnk.geovillageid || '';   f.stnkvillagename = stnk.villagename || '';

async function doSearch(){
  const qn = S.searchQuery.trim().replace(/\s+/g, '');
  if (qn.length < 4){ toast(t('booking.msg.typeMinChars'), 'err'); return; }
  S.unitSuggestOpen = false;
  // kalau user sudah memilih suggestion, load unit itu persis (penting utk plat kembar)
  if (S.selectedUnitId){
    const picked = byUnitId(S.selectedUnitId);
    if (picked){ applyUnit(picked); return; }
  }
  const list = await fetchUnits(S.searchQuery.trim());   // live (atau fallback dummy)
  if (list && list.length) applyUnit(list[0]);
  else applyUnit(null);
}

/* validasi Langkah 1 */
function validate(){
  const f = S.form, e = {};
  if (!f.callername.trim()) e.callername = 'booking.form.callerNameRequired';
  const phoneDigits = f.callerphone.replace(/\D/g, '');
  if (!phoneDigits) e.callerphone = 'booking.form.phoneRequired';
  else if (isIndonesia()){
    if (phoneDigits.length < 8 || phoneDigits.length > 13) e.callerphone = 'booking.form.phoneLength';
    else if (!lookupProvider(phoneDigits)) e.callerphone = 'booking.form.phoneNotRegistered';
  }
  else if (!/^[1-9][0-9]{8,12}$/.test(phoneDigits)) e.callerphone = 'booking.form.phoneInvalid';
  if (needsAddress()){
    if (!f.address.trim()) e.address = 'booking.form.addressRequired';
    if (!f.geoprovinceid) e.geoprovinceid = 'booking.form.provinceRequired';
    if (!f.geocityid) e.geocityid = 'booking.form.cityRequired';
    if (!f.geodistrictid) e.geodistrictid = 'booking.form.districtRequired';
    if (!f.geovillageid) e.geovillageid = 'booking.form.villageRequired';
  }
  if (!f.policenumber.trim()) e.policenumber = 'booking.form.vehicleRequired';
  if (!String(f.lastkilometer).trim()) e.lastkilometer = 'booking.form.lastKilometerRequired';
  else if (Number(f.minkilometer || 0) > 0 && Number(String(f.lastkilometer).replace(/\D/g, '') || '0') < Number(f.minkilometer)) e.lastkilometer = 'booking.form.kmBelowLast';
  if (!f.bookingdate) e.bookingdate = 'booking.form.dateRequired';
  else if (f.bookingdate < todayISO()) e.bookingdate = 'booking.form.dateBackdate';
  if (!f.bookingtime) e.bookingtime = 'booking.form.timeRequired';
  S.errors = e;
  return Object.keys(e).length === 0;
}
function goNext(){
  if (!validate()){ render(); toast(t('booking.msg.invalidForm'), 'err'); return; }
  S.step = 2; window.scrollTo(0, 0); render(); toast(t('booking.msg.validForm'), 'ok');
}

function stepper(){
  const steps = [
    { n:1, name:t('booking.step1.name') },
    { n:2, name:t('booking.step2.name') },
    { n:3, name:t('booking.step3.name') },
  ];
  let h = '<div class="stepper">';
  steps.forEach((s, i) => {
    if (i) h += '<div class="stp-bar' + (S.step > s.n - 1 ? ' on' : '') + '"></div>';
    const cls = S.step === s.n ? 'stp on' : (S.step > s.n ? 'stp done' : 'stp');
    h += '<div class="' + cls + '">' +
      '<div class="dot">' + (S.step > s.n ? ic('check', 16) : '<i></i>') + '</div>' +
      '<div class="lb">' + esc(t('booking.step.prefix')) + ' ' + s.n + '</div>' +
      '<div class="sb">' + esc(s.name) + '</div>' +
    '</div>';
  });
  return h + '</div>';
}

/* baris info di bawah input telepon: awalan 0, provider, aturan panjang 8-13 */
function phoneFeedback(){
  const parts = [];
  if (S.phoneZeroHint)
    parts.push('<span class="pfeed warn">' + ic('alert', 14) + esc(t('booking.form.phoneNoLeadingZero')) + '</span>');
  // sisanya khusus +62; saat ada error callerphone, pesan sudah tampil di hint field
  if (isIndonesia() && !S.errors.callerphone){
    const digits = String(S.form.callerphone).replace(/\D/g, '');
    const hit = lookupProvider(digits);
    if (hit)
      parts.push('<span class="pfeed ok">' + ic('checkCircle', 14) + esc(t('booking.form.phoneProvider')) + ': <b>' + esc(hit.name) + '</b></span>');
    // info aturan panjang + penghitung karakter, tampil selama ada input
    if (digits.length > 0)
      parts.push('<span class="pfeed info">' + ic('info', 14) + '<span>' + esc(t('booking.form.phoneRule')) +
        ' <b class="tnum">(' + digits.length + '/13)</b></span></span>');
  }
  return parts.join('');
}

function unitSearchInput(rows, ph){
  const qns = S.searchQuery.trim().replace(/\s+/g, '');
  const showSuggest = S.unitSuggestOpen && qns.length >= 4;
  let pop = '';
  if (showSuggest){
    pop = '<div class="pop" onclick="event.stopPropagation()">' +
      (rows.length ? rows.map(r =>
        '<button type="button" class="opt' + (String(r.value) === String(S.selectedUnitId) ? ' sel' : '') + '" onclick="pickSearchResult(\'' + esc(r.value) + '\')">' +
          '<span>' + esc(r.label) + '</span>' +
          (r.sub ? '<span class="sub">' + esc(r.sub) + '</span>' : '') +
        '</button>').join('')
        : '<div class="empty">' + esc(S.searchLoading ? t('booking.msg.searching') : t('booking.placeholder.noResult')) + '</div>') +
    '</div>';
  }
  return '<div style="position:relative">' +
    '<div class="searchbox">' +
      '<span class="ci">' + ic('search', 16) + '</span>' +
      '<input id="unitSearchInput" autocomplete="off" placeholder="' + esc(ph) + '" value="' + esc(S.searchQuery) + '"' +
        ' oninput="onUnitSearchInput(this.value)" onfocus="openUnitSuggest()" onclick="event.stopPropagation()"' +
        ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();doSearch();}">' +
    '</div>' + pop +

}

function setHelperPick(id){ S.helperpick = id; S.openCombo = null; render(); }

function removeHelper(id){ S.form.helpermechanics = S.form.helpermechanics.filter(h => h.id !== id); render(); }
function addService(code){ if (code && !S.form.serviceitems.some(s => s.code === code)){ const s = MST_SERVICE.find(x => x.code === code); if (s) S.form.serviceitems.push({ code:s.code, name:s.name, price:s.price }); } S.openCombo = null; render(); }
function removeService(code){ S.form.serviceitems = S.form.serviceitems.filter(s => s.code !== code); render(); }
function addPart(code){ if (code && !S.form.partitems.some(p => p.code === code)){ const p = MST_PART.find(x => x.code === code); if (p) S.form.partitems.push({ code:p.code, name:p.name, price:p.price, qty:1 }); } S.openCombo = null; render(); }
function removePart(code){ S.form.partitems = S.form.partitems.filter(p => p.code !== code); syncLightRepair(); render(); }
function partQty(code, delta){ const p = S.form.partitems.find(x => x.code === code); if (p){ p.qty = Math.max(1, (p.qty || 1) + delta); render(); } }

      ['Alur pencarian unit (Nopol/Mesin/Rangka)', '<b>Input langsung di kotak atas</b> (bukan combo). Ketik &ge; 4 karakter &rarr; <b>suggestion muncul di bawah kotak</b>. Pilih suggestion &rarr; nilainya <b>masuk ke kotak input</b> (data BELUM di-load). Baru setelah klik tombol <b>Cari</b> data di-load &amp; mengisi field di bawah. Enter di kotak input = klik Cari. Khusus 3 pencarian ini; dropdown lain (Kode Tipe Unit/Warna/Geo) tetap combo biasa.', 'Hint: "Ketik minimal 4 karakter untuk mencari"'],
      ['Pilih suggestion vs tombol Cari', 'Memilih suggestion hanya mengisi kotak + menandai unit terpilih (<code>selectedUnitId</code>). <b>Cari</b> me-load unit terpilih itu persis (penting utk <b>plat kembar</b> spt AA 2022 BB); bila belum memilih, Cari mengambil hasil terbaik dari pencarian teks. Mengetik ulang membatalkan pilihan sebelumnya.', '&mdash;'],
      ['Cari &mdash; Plat Nomor', 'Cari ke kolom <code>policenumber</code>. <b>TRIM/hapus spasi</b> di kata kunci MAUPUN kolom agar cocok walau beda spasi (mis. <code>REPLACE(policenumber,\' \',\'\')</code>).', '&mdash;'],
      ['Cari &mdash; Nomor Mesin', 'Cari ke kolom <code>machinenumber</code>.', '&mdash;'],
      ['Cari &mdash; Nomor Rangka', 'Cari ke kolom <code>framenumber</code>.', '&mdash;'],
      ['Saat ditemukan &mdash; load', 'Plat Nomor (disable) &larr; <code>policenumber</code>; Nomor Mesin &larr; <code>machinenumber</code>; Nomor Rangka &larr; <code>framenumber</code>; Tahun Rakit &larr; <code>yearofass</code>; <b>Kilometer Terakhir &larr; <code>lastkilometer</code></b> (0 bila kosong, tetap enable).', '&mdash;'],
      ['Saat ditemukan &mdash; Kode Tipe Unit', '&larr; <code>SIRIS.dbo.mstmotorahm.code</code>. Jembatan: <code>mstvehicle.motorid</code> &rarr; customer <code>mstmotor.code</code> &rarr; <code>SIRIS.mstmotor.code</code> &rarr; <code>mstmotor.motorahmid = mstmotorahm.id</code> (motorid vehicle TIDAK ada di SIRIS.mstmotor, jadi match by kode motor).', '&mdash;'],
      ['Saat ditemukan &mdash; Market Name', '&larr; <code>SIRIS.dbo.mstmotorahm.name</code> (jembatan sama). Tetap disable.', '&mdash;'],
      ['Saat ditemukan &mdash; Warna', '&larr; <code>mstmotorcolor.colorname</code> (join <code>mstvehicle.motorcolorid = mstmotorcolor.id</code>).', '&mdash;'],
      ['Tab Informasi STNK &mdash; sumber', 'Dari <code>custvehiclestnk</code> + <code>mstcustomer</code> (join <code>vehicleid</code>, lalu <code>customerid</code>). Masa Berlaku STNK &amp; Jatuh Tempo Pajak DIHILANGKAN.', '&mdash;'],
      ['STNK &mdash; mode VIEW (terkunci)', 'Nama Pemilik STNK &larr; <code>fullname</code>; NIK &larr; <code>nik</code>; Alamat &larr; <code>address1 + \x27 \x27 + address2</code>; Kode Pos &larr; <code>postalcode</code>; Provinsi/Kota/Kec/Kel = nama dari <code>mstgeo*</code> (semua read-only).', '&mdash;'],
      ['STNK &mdash; mode UBAH', 'Field yang KOSONG bisa langsung diinput. Nama pecah jadi <b>Nama Awal</b>(firstname) + <b>Nama Akhir</b>(lastname) [enable]; Alamat pecah jadi <b>Alamat 1</b>+<b>Alamat 2</b> [enable]; Kode Pos [enable]; Provinsi/Kota/Kec/Kel dropdown dari <code>mstgeo*</code>. <b>Provinsi STNK = SEMUA provinsi</b> (beda dgn Lokasi Layanan yang dibatasi JATIM/NTT).', '&mdash;'],
      ['STNK &mdash; NIK Pemilik', '<b>Terkunci HANYA bila sudah terisi</b> saat mulai Ubah (snapshot di awal edit). Jika <b>kosong</b> &rarr; boleh diinput (angka, maks 16). Setelah disimpan berisi, edit berikutnya otomatis terkunci.', '&mdash;'],
      ['STNK &mdash; Kota/Kecamatan/Kelurahan', '<b>Selalu bisa diedit</b> di mode Ubah, walau sudah ada datanya (tidak ikut aturan kunci NIK). Difilter oleh induk bila induk dipilih; bila induk kosong menampilkan semua opsi. Catatan BE: pastikan konsistensi induk-anak saat simpan.', '&mdash;'],
      ['Tombol Ubah &mdash; Kendaraan vs STNK <b>INDEPENDEN</b>', 'Tab <b>Informasi Kendaraan</b> dan <b>Informasi STNK</b> punya tombol Ubah/Simpan <b>masing-masing dengan state terpisah</b> (<code>vehicleLocked</code> vs <code>stnkEdit</code>). Membuka edit STNK <b>tidak</b> membuka field kendaraan, dan Simpan STNK <b>tidak</b> memicu write-back <code>dbo.mstvehicle</code> (begitu pula sebaliknya).', '&mdash;'],
      ['Simpan STNK &mdash; UPDATE ke <code>dbo.mstcustomer</code>', 'Menjalankan WRITE-BACK: <code>UPDATE dbo.mstcustomer SET firstname, lastname, fullname, address1, address2, postalcode, geoprovinceid, geocityid, geodistrictid, geovillageid, <b>modifiedby = &lt;user login aplikasi&gt;, modifieddatetime = getdate()</b> WHERE id = &lt;customerid&gt;</code>. NIK tidak ikut diupdate (disable). Kunci <code>customerid</code> = <code>custvehiclestnk.customerid</code> (dikirim server di <code>stnk.customerid</code>). Payload memuat objek <code>mstcustomerUpdate</code> (null bila customerid kosong).', 'Toast: "Perubahan data STNK disimpan (mstcustomer.fullname=..., modifiedby=...)"'],
      ['Cari kendaraan (ringkas)', 'Cari berdasarkan Plat Nomor / No. Mesin / No. Rangka.', '&mdash;'],
      ['Field kendaraan', 'Read-only sampai unit ditemukan ATAU tombol <b>Ubah</b> ditekan (untuk unit belum terdaftar).', '&mdash;'],
      ['Unit ditemukan', 'Prefill data kendaraan + STNK. Alamat layanan (HS/AJ) di-prefill dari alamat STNK bila masih kosong.', 'Toast: "Data kendaraan ditemukan"'],
      ['Unit ditemukan &mdash; klik Ubah (edit)', 'Yang <b>enable HANYA Plat Nomor</b> (plus Kilometer Terakhir yang memang selalu enable). Nomor Mesin, Nomor Rangka, Kode Tipe Unit, Tahun Rakit, Market Name, Warna tetap <b>disable</b>. Alasan: <b>plat nomor bisa berubah untuk nomor mesin yang sama</b>, sisanya milik unit dan tidak boleh diubah dari layar ini.', '&mdash;'],
      ['Unit ditemukan &mdash; klik Simpan (Update)', 'Menjalankan WRITE-BACK ke <code>dbo.mstvehicle</code>: <code>UPDATE dbo.mstvehicle SET policenumber = &lt;Plat Nomor&gt;, lastkilometer = &lt;Kilometer Terakhir&gt; WHERE id = &lt;unitid&gt;</code>. Km divalidasi dulu (tidak boleh &lt; lastkilometer); bila melanggar, Simpan dibatalkan. Payload memuat objek <code>mstvehicleUpdate</code> (null bila unit tidak ditemukan).', 'Toast: "Update ke dbo.mstvehicle: policenumber=..., lastkilometer=..."'],
      ['Unit tidak ditemukan (Plat/Mesin/Rangka)', 'Field kendaraan otomatis <b>enable</b> untuk input manual: Plat Nomor, Nomor Mesin, Nomor Rangka, <b>Kode Tipe Unit</b>, <b>Tahun Rakit</b>, Warna. <b>Market Name tetap disable</b> (auto dari Kode Tipe Unit).', '"Kendaraan tidak ditemukan. Gunakan tombol Ubah untuk input manual."'],
      ['Market Name', 'SELALU disable. Terisi otomatis = <code>msttwodigitmotor.deskripsi</code> begitu <b>Kode Tipe Unit</b> dipilih.', '&mdash;'],
      ['Kode Tipe Unit / Tahun Rakit', 'Label baru (sebelumnya Kode Dua Digit / Tahun Perakitan). Kolom tetap <code>twodigitcode</code> / <code>assemblyyear</code>.', '&mdash;'],
      ['Dropdown Kode Tipe Unit (manual)', 'Isi daftar dari <code>SIRIS.dbo.mstmotorahm.code</code>, <b>urut code ASC</b>. Pilih salah satu &rarr; <b>Market Name terisi otomatis</b> dari <code>mstmotorahm.name</code>.', '&mdash;'],
      ['Kilometer Terakhir', 'Prefill dari <code>mstvehicle.lastkilometer</code> saat unit ditemukan (0 bila kosong/null). SELALU <b>enable</b> &amp; bisa diedit, tidak ikut terkunci. Wajib.', '"Kilometer terakhir wajib diisi"'],
      ['Kilometer Terakhir &mdash; batas', 'Tidak boleh <b>lebih kecil</b> dari <code>mstvehicle.lastkilometer</code> (odometer hanya naik). Ada peringatan live &amp; blok Lanjut bila kurang.', '"Kilometer tidak boleh kurang dari kilometer terakhir kendaraan (X km)"'],
      ['Plat Nomor (data kendaraan)', 'Wajib terisi.', '"Data kendaraan wajib diisi"'],
      ['Kilometer Terakhir', '<b>Wajib</b>, selalu bisa diisi manual (tidak ikut terkunci).', '"Kilometer terakhir wajib diisi"'],
    ]) +

    subHead('D. Jadwal Booking') +
    ruleTable([
      ['Jalur Booking (dulu Channel Booking)', 'Wajib. Dropdown group <code>BOOKINGCHANNEL</code>. Label = <b>Jalur Booking</b>. Default <b>Telepon (TLP)</b>. Hanya 2 pilihan: <b>Telepon</b> / <b>Kunjungan</b> (tanpa opsi kosong "Pilih").', 'Nilai asli SIRIS: VST / TLP.'],
      ['Catatan', '<b>Opsional</b> (tidak wajib). Maksimal <b>100 karakter</b> (di-cap keras di input).', '&mdash;'],
      ['Tanggal Booking', '<b>Wajib</b>, KOSONG di awal (bukan default hari ini). Dipilih lewat <b>datepicker</b> (input type=date). <b>Tidak boleh backdate</b>: min = hari ini (<code>getdate()</code> / today) &mdash; tanggal sebelum hari ini di-disable di picker &amp; ditolak validasi. Ganti tanggal me-reset pilihan jam.', '"Tanggal booking wajib dipilih" / "Tanggal booking tidak boleh sebelum hari ini"'],
      ['Summary &mdash; muncul kondisional + BISA DIKLIK', '<b>TIDAK tampil di awal.</b> Baru muncul setelah Tanggal Booking dipilih (berisi Tanggal, Jam, Lokasi layanan). <b>Summary bisa diklik</b> untuk membuka modal <b>"Pilih Waktu Pemesanan"</b> (pengganti chip Pilih Jam inline).', '&mdash;'],
      ['Modal Pilih Waktu Pemesanan', 'Header = hari + tanggal panjang (mis. "Sabtu, 12 September 2026"). Kartu slot per JAM menampilkan range + <b>sisa slot</b> ("Sisa N Slot"); slot <b>penuh (kuota 0)</b> disabled/dicoret. Pilih slot &rarr; klik <b>Simpan</b> (isi Summary + simpan <code>bookingslothourid</code>); <b>Kembali</b>/×/klik luar = batal. Jam wajib dipilih.', '"Jam booking wajib dipilih"'],
      ['Sumber slot &amp; sisa (DB: SNEMESIAGEN_BOOKING)', 'Slot: <code>dbo.mstbookingslothour</code> (starttime/endtime/capacity) JOIN <code>dbo.mstbookingslot</code> difilter <b>nmscode dealer</b> + <b>hari</b> (gvdayofweekid, code=isodow) + tipe <b>"Home Service"</b> (gvbookingslottype via mstgeneralvalue). <b>Sisa</b> = <code>capacity - COUNT(dbo.trxbookinghomeservice</code> pada <code>bookingslothourid</code> + <code>bookingdate</code> yang aktif<code>)</code>. Endpoint: <code>GET /booking/homeservice/slot?date=&nmscode=</code>.', '&mdash;'],
      ['Status awal', 'Booking baru dibuat dengan <code>statuscode = 10</code> (Open / Belum Follow Up) dari group <code>BOOKINGSTATUS</code>.', '&mdash;'],
    ]) +

    subHead('E. Langkah 2 &mdash; Data Mekanik, Jasa Service &amp; Spare Part') +
    '<p style="margin:0 0 8px">Tombol Langkah 1 "<b>Data Mekanik, Service dan Part</b>" (validasi Langkah 1 dulu) &rarr; pindah ke Langkah 2. Master mekanik/service/part di mockup masih DUMMY, siap dibinding ke tabel master.</p>' +
    ruleTable([
      ['Mekanik Bertanggung Jawab', '<b>Wajib</b>. Single-select (list of view) mekanik yang ditugaskan Home Service.', '"Mekanik bertanggung jawab wajib dipilih"'],
      ['Mekanik yang Membantu', 'Opsional, <b>boleh lebih dari satu</b>. <b>Terkunci sampai Mekanik Bertanggung Jawab dipilih</b> dulu. Alur: pilih mekanik di dropdown &rarr; klik tombol <b>+ Tambah</b> &rarr; masuk daftar (chips, bisa dihapus). Tidak boleh sama dengan mekanik utama; yang sudah ditambahkan tidak muncul lagi di dropdown.', '&mdash;'],
      ['Jasa Service (2 level)', 'Tombol <b>Tambah Service</b> &rarr; modal. <b>LEVEL 1</b>: klik <b>+ Paket Service</b> &rarr; daftar PAKET (dari <code>dbo.mstservicepackage.name</code>) &mdash; <b>hanya paket yang DIIZINKAN untuk Home Service</b> (di mockup dibatasi dummy <code>[06,07,11]</code>; di real WAJIB cek tabel setting &mdash; lihat baris "Filter paket" di bawah); pilih satu &rarr; jadi chip. <b>LEVEL 2</b>: muncul <b>HANYA 1 variant</b> yang cocok &mdash; sesuai <b>segment (MATIC/CUB/SPORT/EV)</b> &amp; <b>category (LOW/MID/HIGH)</b> motor dari Kode Tipe Unit kendaraan booking (badge di judul). Pilih &rarr; <b>Simpan</b> &rarr; masuk daftar (nama+durasi+harga), bisa dihapus. <b>Jasa yang sudah dipilih tidak bisa dipilih lagi</b>: variant hilang dari LEVEL 2, dan bila semua variant sebuah paket sudah dipilih, paketnya ikut hilang dari LEVEL 1.', '&mdash;'],
      ['Filter paket (DB: SNEMESIAGEN_SETTING)', '<b>Daftar paket di Tambah Pekerjaan Home Service WAJIB dibatasi oleh setting</b>, bukan menampilkan semua <code>mstservicepackage</code>. Sumber: <code>dbo.mstsettingsdmsdtl d JOIN dbo.mstsettingsdms h ON h.id=d.headerid</code> dengan <code>h.settingname=\x27Paket Service Home Service\x27</code> (atau settingcode tetap), <code>h.isactive AND d.isactive</code>, <code>d.tag1 = mstservicepackage.jobid</code> (jobid paket yg diizinkan), scope dealer via <code>d.nmscode</code> (kosong = berlaku semua dealer). Karena <b>SETTING &amp; SERVICE beda database</b> (Postgres tak bisa query lintas-DB), BE ambil daftar jobid diizinkan dari SETTING dulu, lalu filter <code>mstservicepackage WHERE status=1 AND jobid = ANY(:diizinkan)</code>. Di mockup disimulasikan konstanta <code>HS_ALLOWED_PKG=[06,07,11]</code>.', '&mdash;'],
      ['Sumber service (DB: SNEMESIAGEN_SERVICE)', 'Query LEVEL 2: <code>dbo.mstservice sv JOIN dbo.mstservicepackage p ON sv.servicepackageid=p.id</code> (paket dipilih) <code>JOIN dbo.mstmotor mo ON sv.gvmotorsegment=mo.gvsegmentid AND sv.gvmotorcategory=mo.gvcategoryid</code> (motor kendaraan booking). <b>PENTING &mdash; penamaan di <code>mstmotor</code> TERBALIK (sudah diverifikasi ke DB 15 Sep 2026):</b> kolom <code>segmentname</code> berisi <b>LOW/MID/HI = tingkatan</b> (yang di FE disebut <b>category</b> Low/Mid/High), kolom <code>categoryname</code> berisi <b>AT/CUB/SPORT/EV = jenis motor</b> (yang di FE disebut <b>segment</b>; <b>AT = Matic</b>, <b>HI = High</b>). Maka pemetaannya: FE <b>segment</b> &rarr; <code>mo.gvcategoryid</code> (= <code>sv.gvmotorcategory</code>); FE <b>category</b> &rarr; <code>mo.gvsegmentid</code> (= <code>sv.gvmotorsegment</code>). <b>Harga = <code>dbo.mstserviceprice.price</code></b> (join <code>serviceid=sv.id</code>, scope <code>gvappliesto</code>). <b>Estimasi waktu (Menit) = <code>dbo.mstservicepackage.estimatetime</code></b> (level paket). <b>Discount TIDAK ditampilkan.</b> <b>CATATAN DATA: <code>mstservice</code> &amp; <code>mstserviceprice</code> saat ini masih KOSONG (0 baris) &mdash; BE wajib mengisi variant + harga; <code>mstservicepackage</code> (23 baris) &amp; <code>mstmotor</code> (1006) sudah terisi.</b>', '&mdash;'],
      ['Jasa Light Repair otomatis (DB: SIRIS)', '<b>Light repair TIDAK muncul di pilihan paket.</b> Jasa Light repair <b>otomatis ter-load</b> ke daftar service saat memilih <b>part yang ter-mapping</b> ke jasa Light repair. Sumber: <code>dbo.mstmappingpartlr</code> &mdash; filter <code>twodigitcode = &lt;Kode Tipe Unit booking&gt;</code> AND <code>partcode = &lt;part dipilih&gt;</code> (bisa via <code>partid</code>). Bila ketemu &rarr; tambah 1 baris jasa Light repair dgn <b>harga = <code>pricejasalr</code></b> dan durasi/<code>frt</code>. <b>Tidak semua part ter-mapping</b> &mdash; hanya yang ada di <code>mstmappingpartlr</code>. Kalau part dihapus, jasa LR otomatisnya ikut hilang. <b>CATATAN DATA: <code>mstmappingpartlr</code> ada 5 baris (unit CL/GB/CH/CG/GD), tapi belum untuk unit demo</b> &mdash; di mockup disimulasikan <code>MST_PART_LR</code> (partcode+twodigitcode&rarr;pricejasalr/frt).', '&mdash;'],
      ['Spare Part', 'Tombol <b>Tambah Part</b> &rarr; buka modal "Tambah Part": daftar part <b>yang BERELASI dgn unit</b> (cek <code>SIRIS.dbo.mstpartkendaraan</code>, filter <code>kodetwodigit = &lt;Kode Tipe Unit&gt;</code>; di mockup: <code>MST_PART.units[]</code>). Search + pilih kartu part (multi), klik <b>Simpan</b>. Item spare part yang <b>dibawa mekanik ke rumah customer</b> masuk daftar dengan <b>qty</b> (stepper &minus;/+), subtotal = harga &times; qty (tanpa discount), bisa dihapus. (Bila jasa Ganti oli plus dipilih &rarr; picker beralih ke grup OIL, lihat baris di atas.)', '&mdash;'],
      ['Part OIL saat Ganti oli plus (DB: SIRIS)', 'Bila jasa <b>Ganti oli plus</b> ada di daftar service, picker Tambah Part <b>hanya menampilkan part grup OIL yang ter-mapping ke unit</b>. Query: <code>dbo.mstpartkendaraan pk JOIN dbo.mstpart p ON p.id=pk.partid JOIN dbo.mstpartgroup g ON g.id=p.partgroupid</code>, filter <code>pk.kodetwodigit = &lt;Kode Tipe Unit booking&gt;</code> (mis. VG/KF/JM) <b>AND <code>upper(g.name)=\x27OIL\x27</code></b> (jangan pakai <code>partgroupcode</code> karena ada grup OIL duplikat: code OIL/00231/TRY11). Harga = <code>dbo.mstpricepart.unitpricerpt</code> (partcode, ambil <code>effectivedate</code> terbaru; per dealer: <code>mstpricepartdealer</code>). <b>CATATAN DATA: <code>mstpartkendaraan</code> masih KOSONG (0 baris) &mdash; BE wajib mengisi mapping unit&harr;part; grup OIL juga perlu dirapikan (duplikat). Di mockup disimulasikan <code>MST_PART_OIL</code> (units[] = daftar kodetwodigit).</b>', '&mdash;'],
      ['Master service/part', 'Di mockup memakai data DUMMY (MST_SERVICE per kategori + MST_PART). Siap dibinding ke tabel master service &amp; part beserta harga/durasi/stok (part tanpa discount).', '&mdash;'],
      ['Navigasi', '<b>Kembali</b> &rarr; Langkah 1 (data tidak hilang). <b>Lanjut ke Ringkasan</b> &rarr; Langkah 3 (belum dibuat) &mdash; validasi mekanik utama dulu.', '&mdash;'],
    ]) +

    subHead('F. Umum') +
    '<ul>' +
      '<li>Tombol <b>Lanjut ke Langkah 2</b> menjalankan validasi seluruh field di atas sekaligus. Bila ada error: semua field bertanda merah + toast "Lengkapi field yang ditandai merah". Bila valid: toast "Data Langkah 1 valid, siap lanjut ke Langkah 2".</li>' +
      '<li>Field state memakai <b>nama kolom</b> tabel (bukan camelCase UI), sehingga <code>buildPayload()</code> langsung menghasilkan bentuk baris siap kirim ke API. Lihat tombol <b>Lihat Payload</b>.</li>' +
      '<li>Bahasa dapat diganti ID/EN; seluruh teks & pesan validasi mengikuti key <code>booking.*</code>.</li>' +
    '</ul>' +

    '<h2>Master yang dipakai (sudah diverifikasi ada di DB SIRIS)</h2>' +
    '<p>Diperiksa langsung ke PostgreSQL SIRIS <code>10.10.108.20:65432</code>, 9 Sep 2026. ' +
      'Semua tabel ada di schema <b><code>dbo</code></b> (bukan <code>siris</code> seperti tertulis di file ERD).</p>' +
    '<ul>' +
      '<li><code>dbo.mstgeoprovince</code> &rarr; <code>mstgeocity</code> &rarr; <code>mstgeodistrict</code> &rarr; <code>mstgeovillage</code> (cascading, filter pakai FK induk)</li>' +
      '<li><code>dbo.mstgeneralvalue</code> + <code>mstgeneralvaluegroup</code>, group code yang dipakai: ' +
        '<code>BOOKINGTYPE</code> (HS/BE/AJ), <code>BOOKINGCHANNEL</code> (VST/TLP), <code>BOOKINGSTATUS</code> (10-14), ' +
        '<code>PHONECOUNTRYCODE</code>, <code>PREFIXPHONE</code> (39 baris / 6 operator)</li>' +
      '<li><b>Sumber kendaraan (DB terpisah):</b> <code>SNEMESIAGEN_CUSTOMER.dbo.mstvehicle</code> &mdash; kolom <code>policenumber</code>, <code>machinenumber</code>, <code>framenumber</code>, <code>yearofass</code>, <code>lastkilometer</code>, FK <code>motorid</code> &amp; <code>motorcolorid</code> ke SIRIS.</li>' +
      '<li>Enrich kendaraan (CROSS-DB): Warna dari <code>SNEMESIAGEN_CUSTOMER.dbo.mstmotorcolor.colorname</code> (via <code>motorcolorid</code>). <b>Kode Tipe Unit &amp; Market Name dari SIRIS</b>: <code>SIRIS.dbo.mstmotorahm.code</code> &amp; <code>.name</code>, join <code>mstmotor.motorahmid = mstmotorahm.id</code>, dijembatani lewat KODE MOTOR (customer.mstmotor.code = SIRIS.mstmotor.code) karena mstvehicle.motorid tidak ada di SIRIS.mstmotor.</li>' +
      '<li><code>dbo.mstdealer</code> (dealertype <code>H2</code>) untuk Lokasi Layanan = AHASS &mdash; ambil <code>ahmcode</code>, <code>name</code>, <code>ispos</code> dari dealer user login. Juga sumber <code>dealerid</code>.</li>' +
      '<li><b>Slot jam booking (DB terpisah lagi):</b> <code>SNEMESIAGEN_BOOKING.dbo.mstbookingslothour</code> (starttime/endtime/capacity) + <code>dbo.mstbookingslot</code> (per nmscode/hari/tipe) + <code>dbo.mstgeneralvalue</code> (hari &amp; tipe). Sisa slot dari <code>dbo.trxbookinghomeservice.bookingslothourid</code>.</li>' +
    '</ul>' +

    '<h2>Slot Jam Booking &mdash; sumber &amp; hitung sisa (DB: SNEMESIAGEN_BOOKING)</h2>' +
    '<table><thead><tr><th>Tabel</th><th>Peran</th><th>Kolom kunci</th></tr></thead><tbody>' +
      '<tr><td><code>dbo.mstbookingslot</code></td><td>Konfigurasi slot per <b>dealer &times; hari &times; tipe</b></td><td><code>nmscode</code>, <code>gvdayofweekid</code> (hari), <code>gvbookingslottype</code> (= "Home Service"), <code>availablemechanic</code>, <code>startoperating</code>/<code>endoperating</code>, <code>dealerid</code></td></tr>' +
      '<tr><td><code>dbo.mstbookingslothour</code></td><td>Slot <b>per JAM</b> + kapasitas</td><td><code>bookingslotid</code>, <code>starttime</code>/<code>endtime</code> (range), <b><code>capacity</code></b>, <code>availableflag</code>, <code>activeflag</code></td></tr>' +
      '<tr><td><code>dbo.mstgeneralvalue</code></td><td>Master hari &amp; tipe slot</td><td><code>code</code> (hari: 1=Senin&hellip;7=Minggu = <code>isodow</code>), <code>name</code></td></tr>' +
      '<tr><td><code>dbo.trxbookinghomeservice</code></td><td>Sumber <b>terpakai</b> (booked)</td><td><b><code>bookingslothourid</code></b> (kolom baru), <code>bookingdate</code>, <code>statuscode</code></td></tr>' +
    '</tbody></table>' +
    '<p style="margin:8px 0 4px"><b>Sisa slot</b> = <code>mstbookingslothour.capacity</code> &minus; jumlah <code>trxbookinghomeservice</code> aktif pada <code>bookingslothourid</code> + <code>bookingdate</code> yang sama. Query (teruji):</p>' +
    '<pre class="code">' + esc(
      "-- param: :nmscode (dealer login), :tgl (tanggal booking)\n" +
      "SELECT h.id AS bookingslothourid,\n" +
      "       to_char(h.starttime,'HH24:MI')||' - '||to_char(h.endtime,'HH24:MI') AS slot,\n" +
      "       h.capacity,\n" +
      "       h.capacity - COALESCE((\n" +
      "         SELECT count(*) FROM dbo.trxbookinghomeservice b\n" +
      "         WHERE b.bookingslothourid = h.id AND b.bookingdate = :tgl\n" +
      "           AND (b.deleteddatetime IS NULL OR b.deleteddatetime='1900-01-01')\n" +
      "           -- AND b.statuscode <> '<kode batal>'\n" +
      "       ),0) AS sisa_slot\n" +
      "FROM dbo.mstbookingslot bs\n" +
      "JOIN dbo.mstgeneralvalue typ ON bs.gvbookingslottype = typ.id AND typ.name = 'Home Service'\n" +
      "JOIN dbo.mstgeneralvalue dow ON bs.gvdayofweekid = dow.id AND dow.code = extract(isodow FROM :tgl)::text\n" +
      "JOIN dbo.mstbookingslothour h ON h.bookingslotid = bs.id\n" +
      "WHERE bs.nmscode = :nmscode\n" +
      "  AND (bs.deleteddatetime IS NULL OR bs.deleteddatetime='1900-01-01')\n" +
      "  AND (h.deleteddatetime  IS NULL OR h.deleteddatetime='1900-01-01')\n" +
      "  AND COALESCE(h.activeflag,true) AND COALESCE(h.availableflag,true)\n" +
      "ORDER BY h.starttime;"
    ) + '</pre>' +

    '<h2>Temuan saat cek DB (perlu ditindaklanjuti)</h2>' +
    '<ul>' +
      '<li><b>Perubahan skema (sudah dijalankan):</b> kolom <code>bookingslothourid uuid</code> (nullable) DITAMBAHKAN ke <code>SNEMESIAGEN_BOOKING.dbo.trxbookinghomeservice</code> supaya sisa slot bisa dihitung dari tabel ini. Tanpa FK (konvensi tabel = hanya PK). Isi = <code>mstbookingslothour.id</code> slot terpilih.</li>' +
      '<li>FK-nya bernama <code>mstgeneralvalue.genvaluegroupid</code>, sedangkan di <code>ng-nms-erd.dbml</code> tertulis ' +
        '<code>generalvaluegroupid</code> dan schema-nya <code>siris</code>. File ERD perlu dibetulkan.</li>' +
      '<li><b>Soft delete:</b> 334 baris <code>mstgeneralvalue</code> memakai sentinel <code>deleteddatetime = \'1900-01-01\'</code> ' +
        'dan 62 baris <code>NULL</code>. Jadi filter <code>deleteddatetime IS NULL</code> justru membuang data aktif &mdash; ' +
        'pakai <code>(deleteddatetime IS NULL OR deleteddatetime = \'1900-01-01\')</code>.</li>' +
      '<li>Group <code>PHONECOUNTRYCODE</code> dan <code>COUNTRYCODE</code> terdaftar dua kali di <code>mstgeneralvaluegroup</code>, ' +
        'sehingga tiap kode negara muncul ganda. Perlu dedupe di master atau <code>DISTINCT</code> di query.</li>' +
      '<li>Belum ada tabel apa pun yang namanya mengandung <i>booking</i> / <i>homeservice</i> di SIRIS &mdash; ' +
        '<code>trxbookinghomeservice</code> memang masih harus dibuat.</li>' +
    '</ul>' +
    '<h2>Peta field</h2>' +
    '<table><thead><tr><th>Label di layar</th><th>Kolom</th><th>Tabel</th><th>Tipe</th><th>Catatan</th></tr></thead><tbody>' +
      BIND_ROWS.map(r => '<tr><td>' + r.map(esc).join('</td><td>') + '</td></tr>').join('') +
    '</tbody></table>' +
    '<h2>Endpoint yang dibutuhkan</h2>' +
    '<table><thead><tr><th>Kebutuhan</th><th>Usulan endpoint</th></tr></thead><tbody>' +
      '<tr><td>Master geo bertingkat</td><td><code>GET /master/geo/province</code>, <code>/city?provinceId=</code>, <code>/district?cityId=</code>, <code>/village?districtId=</code></td></tr>' +
      '<tr><td>General value</td><td><code>GET /master/generalvalue?group=CHANNEL BOOKING</code></td></tr>' +
      '<tr><td>Prefix nomor HP</td><td><code>GET /master/generalvalue?group=PREFIXPHONE</code> &mdash; cache di FE, dipakai untuk cek 3 digit awal</td></tr>' +
      '<tr><td>Kode Tipe Unit (master)</td><td><code>GET /master/motorahm</code> &mdash; <code>SIRIS.dbo.mstmotorahm</code> (code + name), urut code asc; dipakai dropdown Kode Tipe Unit (input manual)</td></tr>' +
      '<tr><td>Warna (master)</td><td><code>GET /master/color</code></td></tr>' +
      '<tr><td>Cari kendaraan</td><td><code>GET /unit/search?by=policenumber|machinenumber|framenumber&amp;q=</code> &mdash; sumber <code>SNEMESIAGEN_CUSTOMER.dbo.mstvehicle</code>, hasil di-enrich dari mstmotor &amp; mstmotorcolor (semua di DB yang sama).</td></tr>' +
      '<tr><td>Update kendaraan (saat Simpan, unit ditemukan)</td><td><code>PUT /unit/{unitid}</code> (atau bagian dari POST draft) &mdash; <code>UPDATE SNEMESIAGEN_CUSTOMER.dbo.mstvehicle SET policenumber, lastkilometer WHERE id = unitid</code>. Body = <code>buildPayload().mstvehicleUpdate</code>.</td></tr>' +
      '<tr><td>Update pemilik STNK (saat Simpan STNK)</td><td><code>PUT /customer/{customerid}</code> (atau bagian dari POST draft) &mdash; <code>UPDATE SNEMESIAGEN_CUSTOMER.dbo.mstcustomer SET firstname, lastname, fullname, address1, address2, postalcode, geo*, modifiedby, modifieddatetime WHERE id = customerid</code>. <code>modifiedby</code> = user login sesi, <code>modifieddatetime</code> = getdate() server. Body = <code>buildPayload().mstcustomerUpdate</code>.</td></tr>' +
      '<tr><td>Slot jam booking</td><td><code>GET /booking/homeservice/slot?date=&amp;nmscode=</code> &mdash; sumber <code>SNEMESIAGEN_BOOKING.dbo.mstbookingslothour</code>+<code>mstbookingslot</code> (tipe "Home Service"); sisa = capacity &minus; COUNT(<code>trxbookinghomeservice.bookingslothourid</code> per tanggal)</td></tr>' +
      '<tr><td>Simpan draft Langkah 1</td><td><code>POST /booking/homeservice/draft</code> (body = hasil <code>buildPayload()</code>)</td></tr>' +
    '</tbody></table>' +
    '<h2>Catatan desain</h2>' +
    '<ul>' +
      '<li>Field kendaraan dikunci (read-only) setelah pencarian; tombol <b>Ubah</b> membuka input manual untuk unit yang belum terdaftar.</li>' +
      '<li>Alamat layanan otomatis di-prefill dari alamat STNK saat unit ditemukan, dan tetap bisa diubah &mdash; home service sering beda lokasi dengan STNK.</li>' +
      '<li>Bila Lokasi Layanan bukan Home Service, blok alamat dinonaktifkan dan tidak divalidasi.</li>' +
      '<li><b>Lokasi Layanan</b> (group BOOKINGTYPE) menentukan tampilan: <b>AHASS (BE)</b> &rarr; textbox AHASS (ahmcode - name) &amp; Is Pos dari dealer login (read-only); ' +
        '<b>Home Service (HS)</b> / <b>Antar Jemput (AJ)</b> &rarr; alamat + geo cascading (Provinsi default Jawa Timur). Default form = AHASS. ' +
        'Mockup hanya menyediakan kecamatan/kelurahan untuk Surabaya, Malang, Kupang; kota lain di produksi dimuat dari API.</li>' +
      '<li><b>Nomor telepon:</b> untuk <code>+62</code> angka 0 di depan ditolak saat mengetik/paste, dan panjang dibatasi ' +
        '<b>8-13 digit</b> (maksimal 13 di-cap keras di input, minimal 8 dicek saat Lanjut). Tiga digit pertama dicek ke master ' +
        '<code>PREFIXPHONE</code>: ketemu &rarr; nama provider tampil hijau, tidak ketemu &rarr; peringatan merah dan tombol Lanjut diblokir. ' +
        'Untuk kode negara selain +62 pengecekan prefix &amp; batas panjang khusus ini dilewati. ' +
        'Sumber master: query langsung ke PostgreSQL SIRIS (39 prefix / 6 operator).</li>' +
      '<li><b>Pilih Jam</b> ditambahkan karena SUMMARY pada desain menampilkan <i>Booking Time</i>; slot penuh ditampilkan disabled.</li>' +
    '</ul>' +
  '</div>';
}

/* =========================================================
   RENDER - ROOT
   ========================================================= */
function modal(){
  if (S.modal === 'timeslot') return modalTimeslot();
  if (S.modal === 'addservice') return modalAddService();
  if (S.modal === 'addpart') return modalAddPart();
  if (S.modal !== 'payload') return '';
  return '<div class="ovl" onclick="closeModal()">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div style="display:flex;align-items:flex-start;gap:12px">' +
        '<div><h3>Payload Langkah 1</h3><p style="font-size:13px;color:var(--muted);margin:0">Bentuk baris yang dikirim ke <code>POST /booking/homeservice/draft</code>.</p></div>' +
        '<button class="icon-btn" style="margin-left:auto" onclick="closeModal()">' + ic('x', 18) + '</button>' +
      '</div>' +
      '<pre class="code">' + esc(JSON.stringify(buildPayload(), null, 2)) + '</pre>' +
    '</div>' +
  '</div>';
}
// modal "Pilih Waktu Pemesanan": header tanggal + kartu slot (range jam + sisa slot) + Kembali/Simpan
function modalTimeslot(){
  const dl = fmtDateLong(S.form.bookingdate);
  const cards = TIME_SLOTS.map(s => {
    const full = s.quota === 0;
    const on = S.timeslotTemp === s.time;
    return '<button type="button" class="tslot' + (on ? ' on' : '') + (full ? ' full' : '') + '"' +
      (full ? ' disabled' : ' onclick="pickTimeslotTemp(\'' + s.time + '\')"') + '>' +
        '<div class="tt">' + esc(s.time) + '</div>' +
        '<div class="ts">' + ic('ticket', 13) +
          (full ? esc(t('booking.slot.full')) : (esc(t('booking.slot.remaining')) + ' ' + s.quota + ' ' + esc(t('booking.slot.unit')))) +
        '</div>' +
      '</button>';
  }).join('');
  return '<div class="ovl" onclick="closeModal()">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div style="display:flex;align-items:flex-start;gap:12px">' +
        '<div><h3>' + esc(t('booking.timeslot.title')) + '</h3><p style="font-size:13px;color:var(--muted);margin:0">' + esc(t('booking.timeslot.subtitle')) + '</p></div>' +
        '<button class="icon-btn" style="margin-left:auto" onclick="closeModal()">' + ic('x', 18) + '</button>' +
      '</div>' +
      '<div class="tsdate"><div class="d">' + esc(dl.day) + '</div><div class="f">' + esc(dl.full) + '</div></div>' +
      '<div class="tslots">' + cards + '</div>' +
      '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px">' +
        '<button class="btn btn-ghost" onclick="closeModal()">' + ic('arrowLeft', 16) + esc(t('booking.timeslot.back')) + '</button>' +
        '<button class="btn btn-primary" onclick="saveTimeslot()"' + (S.timeslotTemp ? '' : ' disabled') + '>' + ic('save', 16) + esc(t('booking.timeslot.save')) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}
/* error "wajib diisi" hilang begitu field terisi (mis. hasil prefill unit) */
function pruneErrors(){
  Object.keys(S.errors).forEach(k => {
    const isRequired = String(S.errors[k]).endsWith('Required');
    if (isRequired && String(S.form[k] == null ? '' : S.form[k]).trim()) delete S.errors[k];
  });
}
function render(){
  pruneErrors();
  const app = document.getElementById('app');
  const body = S.view === 'binding'
    ? viewBinding()
    : stepper() + (S.step === 2
        ? cardMechanic() + cardService() + cardPart() + footbarStep2()
        : cardCaller() + cardLocation() + cardVehicle() + cardSchedule() + footbar());
  // simpan fokus + posisi kursor supaya tidak hilang saat innerHTML diganti
  const act = document.activeElement;
  const actId = act && act.id ? act.id : null;
  let caret = null;
  try { caret = act && act.selectionStart != null ? act.selectionStart : null; } catch (e) { caret = null; }

  app.innerHTML = sidebar() +
    '<div class="main">' + topbar() + '<div class="content">' + body + '</div></div>' +
    modal();

  const pop = app.querySelector('.pop .s input');
  if (pop){
    pop.focus();
    pop.setSelectionRange(pop.value.length, pop.value.length);
  } else if (actId){
    const el = document.getElementById(actId);
    if (el){
      el.focus();
      if (caret != null && el.setSelectionRange) {
        const pos = Math.min(caret, el.value.length);
        try { el.setSelectionRange(pos, pos); } catch (e) {}
      }
    }
  }
}
document.addEventListener('click', closeCombo);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (S.modal) closeModal(); else closeCombo(); } });
render();
</script>
